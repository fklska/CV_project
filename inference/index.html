<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV_project · восстановленные кубы</title>
<style>
:root { --bg: #101418; --panel: #181d23; --text: #dce3ea; --dim: #8b98a5; --accent: #4db6ff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
header { padding: 14px 18px; background: var(--panel); display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
h1 { font-size: 16px; margin: 0; font-weight: 600; }
label { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); }
select { background: #0d1013; color: var(--text); border: 1px solid #2a323b; border-radius: 6px; padding: 4px 8px; }
input[type=range] { accent-color: var(--accent); }
#pos { width: 260px; }
#posLabel { color: var(--text); min-width: 70px; display: inline-block; }
#status { color: var(--dim); font-size: 12px; }
main { padding: 16px 18px; max-width: 1600px; margin: 0 auto; }
.stage { display: flex; align-items: center; gap: 10px; }
#cv { flex: 1; min-width: 0; width: auto; height: auto; display: block; background: #000; border-radius: 4px; }
.axlabel { color: var(--dim); font-size: 13px; white-space: nowrap; }
#yLabel { width: 28px; flex: none; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; }
.xrow { display: flex; gap: 10px; margin-top: 6px; }
#xSpacer { width: 28px; flex: none; }
#xLabel { flex: 1; text-align: center; }
#info { color: var(--dim); margin: 12px 2px 0; font-size: 13px; }
#warn { color: #ffb454; padding: 12px; }
</style>
</head>
<body>
<header>
  <h1>Восстановленные кубы</h1>
  <label>Куб <select id="cube"></select></label>
  <label>Ось <select id="axis"></select></label>
  <label>Срез <input type="range" id="pos" min="0" max="0" step="1" value="0"><b id="posLabel">0</b></label>
  <span id="status"></span>
</header>
<main>
  <div id="warn" hidden></div>
  <div class="stage">
    <span id="yLabel" class="axlabel"></span>
    <canvas id="cv"></canvas>
  </div>
  <div class="xrow">
    <span id="xSpacer"></span>
    <span id="xLabel" class="axlabel"></span>
  </div>
  <p id="info"></p>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const els = {
  cube: $("cube"), axis: $("axis"), pos: $("pos"), posLabel: $("posLabel"),
  xLabel: $("xLabel"), yLabel: $("yLabel"),
  info: $("info"), warn: $("warn"), status: $("status")
};
let cubes = [], cubeIdx = -1, axis = 0, rects = [], token = 0;

async function init() {
  const r = await fetch("manifest");
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  cubes = Array.isArray(data) ? data : data.cubes;
  if (!cubes.length) throw new Error("в output/ нет кубов *_cube_restored.npy");
  els.cube.length = 0;
  for (const c of cubes)
    els.cube.add(new Option((c.label || c.sub) + " · " + c.task, c.sub + " " + c.task));
  cubeIdx = cubes.findIndex(c => c.task === "inpainting" && c.missed_axis === 0);
  if (cubeIdx < 0) cubeIdx = 0;
  els.cube.value = cubes[cubeIdx].sub + " " + cubes[cubeIdx].task;
  onCube();
}

function cube() {
  const [sub, task] = els.cube.value.split(" ");
  return cubes.find(c => c.sub === sub && c.task === task) || cubes[cubeIdx];
}

function defaultPos(c, a) {
  for (const b of c.missing_boxes) {
    const s = b[a][0] ?? 0, e = b[a][1] ?? c.shape[a];
    if (s <= 0 && 0 < e) return 0;
  }
  const b = c.missing_boxes[0];
  const s = b ? b[a][0] ?? 0 : 0;
  const e = b ? b[a][1] ?? c.shape[a] : c.shape[a];
  return Math.round((s + e - 1) / 2);
}

function onCube() {
  cubeIdx = +els.cube.value;
  axis = cube().missed_axis;
  const shape = cube().shape;
  els.axis.length = 0;
  for (let a = 0; a < shape.length; a++)
    els.axis.add(new Option("ось " + a + " (" + shape[a] + ")", a));
  els.axis.value = String(axis);
  els.pos.max = String(shape[axis] - 1);
  els.pos.value = String(defaultPos(cube(), axis));
  onPos();
}

function onAxis() {
  axis = +els.axis.value;
  els.pos.max = String(cube().shape[axis] - 1);
  els.pos.value = String(defaultPos(cube(), axis));
  onPos();
}

function onPos() {
  const c = cube();
  const i = +els.pos.value;
  const dims = [0, 1, 2].filter(x => x !== axis);
  const dx = dims[0], dy = dims[1];
  els.posLabel.textContent = i + " / " + (c.shape[axis] - 1);
  els.xLabel.textContent = "ось " + dx + " · " + c.shape[dx];
  els.yLabel.textContent = "ось " + dy + " · " + c.shape[dy];
  const boxes = c.missing_boxes.map(b =>
    "пропуски: " + b.map((r, a) =>
      r[0] === null && r[1] === null ? null
      : "а" + a + " " + (r[0] ?? 0) + "–" + (r[1] ?? c.shape[a] - 1)
    ).filter(s => s).join(", "));
  els.info.textContent = (c.label || c.sub) + " · " + c.task + " · shape [" + c.shape.join(", ") + "]"
    + " · слайд по оси " + axis + " (" + c.shape[axis] + "), срез " + i
    + (boxes.length ? " · " + boxes.join(" · ") : "");
  rects = computeRects(c, axis, i);
  loadSlice(i);
}

function computeRects(c, a, i) {
  const dims = [0, 1, 2].filter(x => x !== a);
  const dx = dims[0], dy = dims[1];
  const w = c.shape[dx], h = c.shape[dy];
  const out = [];
  for (const b of c.missing_boxes) {
    const s = b[a][0] ?? 0, e = b[a][1] ?? c.shape[a];
    if (i < s || i >= e) continue;
    out.push([b[dx][0] ?? 0, b[dy][0] ?? 0,
              (b[dx][1] ?? w) - (b[dx][0] ?? 0), (b[dy][1] ?? h) - (b[dy][0] ?? 0)]);
  }
  return out;
}

function makeHatch(ctx) {
  const c = document.createElement("canvas");
  c.width = c.height = 8;
  const g = c.getContext("2d");
  g.strokeStyle = "rgba(255,255,255,0.55)";
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(0, 8);
  g.lineTo(8, 0);
  g.moveTo(-2, 2);
  g.lineTo(2, -2);
  g.moveTo(6, 10);
  g.lineTo(10, 6);
  g.stroke();
  return ctx.createPattern(c, "repeat");
}
async function loadSlice(i) {
  const c = cube();
  const my = ++token;
  els.status.textContent = "загрузка…";
  const dims = [0, 1, 2].filter(x => x !== axis);
  const w = c.shape[dims[0]], h = c.shape[dims[1]];
  try {
    const r = await fetch(
      "slice?sub=" + encodeURIComponent(c.sub) + "&task=" + c.task + "&axis=" + axis + "&i=" + i);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const plane = new Uint8Array(await r.arrayBuffer());
    if (plane.length !== w * h) throw new Error("slice size mismatch");
    if (my !== token) return;
    const cv = $("cv");
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext("2d");
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let x = 0; x < w; x++) {
      const s = x * h;
      for (let y = 0; y < h; y++) {
        const o = (y * w + x) * 4;
        d[o] = d[o + 1] = d[o + 2] = plane[s + y];
        d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const isSource = c.label === "исходный";
    const hatch = isSource ? makeHatch(ctx) : null;
    for (const [x, y, rw, rh] of rects) {
      if (isSource) {
        ctx.fillStyle = "rgba(13,16,20,0.55)";
        ctx.fillRect(x, y, rw, rh);
        ctx.fillStyle = hatch;
        ctx.fillRect(x, y, rw, rh);
        ctx.font = "600 13px 'Segoe UI', system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const lx = x + rw / 2, ly = y + rh / 2;
        ctx.lineWidth = 3;
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(0,0,0,0.85)";
        ctx.strokeText("нет данных", lx, ly);
        ctx.fillStyle = "#fff";
        ctx.fillText("нет данных", lx, ly);
      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ff3b3b";
      ctx.strokeRect(x, y, rw, rh);
    }
    els.status.textContent = "";
  } catch (e) {
    els.status.textContent = "";
    if (my === token) {
      els.warn.textContent = "Ошибка загрузки среза: " + e.message;
      els.warn.hidden = false;
    }
  }
}

els.cube.addEventListener("change", onCube);
els.axis.addEventListener("change", onAxis);
els.pos.addEventListener("input", onPos);
init().catch(e => {
  els.warn.textContent = "Не удалось инициализировать: " + e.message;
  els.warn.hidden = false;
});
</script>
</body>
</html>
